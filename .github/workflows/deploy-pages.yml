# Dev / staging / production on one GitHub Pages site.
#   /           ← main      (noindex unless SITE_INDEXABLE=true)
#   /staging/   ← staging   (always noindex)
#   /dev/       ← dev       (always noindex)
# Project URL now: https://it33.github.io/metrostatum-landing/
# After custom domain (mattermost.ai): https://mattermost.ai/ , /staging/ , /dev/

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "staging", "dev"]
  workflow_dispatch:
    inputs:
      site_root_base:
        description: "Vite base for production (trailing slash). /metrostatum-landing/ on github.io, / on a custom domain."
        required: false
        default: "/metrostatum-landing/"
      site_indexable:
        description: "Set true only for a public production go-live"
        required: false
        default: "false"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build dev, staging, and production trees
        env:
          GITHUB_PAGES: "true"
          SITE_ROOT_BASE: ${{ github.event.inputs.site_root_base || '/metrostatum-landing/' }}
          SITE_INDEXABLE: ${{ github.event.inputs.site_indexable || 'false' }}
        run: |
          set -euo pipefail
          ROOT="${SITE_ROOT_BASE}"
          case "$ROOT" in
            */) ;;
            *) ROOT="${ROOT}/" ;;
          esac
          mkdir -p assembled

          build_env() {
            local branch="$1"
            local dest="$2"
            local base="$3"
            local indexable="$4"
            if ! git rev-parse --verify "origin/${branch}" >/dev/null 2>&1; then
              echo "Skipping ${branch}: branch not on origin"
              return 0
            fi
            echo "Building ${branch} → ${dest} (base=${base} indexable=${indexable})"
            git checkout --force "origin/${branch}"
            rm -rf dist
            GITHUB_PAGES=true SITE_BASE="${base}" SITE_INDEXABLE="${indexable}" npm run build
            mkdir -p "${dest}"
            cp -a dist/. "${dest}/"
          }

          build_env main assembled "${ROOT}" "${SITE_INDEXABLE}"
          build_env staging assembled/staging "${ROOT}staging/" "false"
          build_env dev assembled/dev "${ROOT}dev/" "false"

          touch assembled/.nojekyll

          if [ -f assembled/robots.txt ]; then
            printf '\n# Environment previews — never index\nUser-agent: *\nDisallow: /dev/\nDisallow: /staging/\n' >> assembled/robots.txt
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./assembled

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
