# Deploy Vite site to GitHub Pages (preview / soft-launch)
# URL after enable: https://it33.github.io/metrostatum-landing/
# SITE_INDEXABLE is intentionally unset on this workflow so Pages stays noindex.
# robots.txt + meta noindex keep crawlers and AI scrapers out until public launch.

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: "true"
          # SITE_INDEXABLE must not be set to true here — Pages stays noindex.
        run: npm run build

      - name: Add .nojekyll (disable Jekyll processing)
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
